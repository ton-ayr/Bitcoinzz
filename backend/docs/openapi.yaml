openapi: 3.0.3
info:
  title: Bitcoinzz API
  version: 2.0.0
  description: |
    API **simulada** de investimento em bitcoin (desafio de backend da Eduzz).

    - Valores em R$ com até 2 casas decimais; BTC com até 8.
    - Todas as rotas, exceto cadastro, login, `/` e `/health`, exigem **Authorization: Bearer &lt;token&gt;**.
      Faça login, copie o `token` e clique em **Authorize**.
    - Erros seguem sempre o formato `{ statusCode, message, details? }`.
    - Cotações: [API v4 do Mercado Bitcoin](https://api.mercadobitcoin.net/api/v4/docs).
      A compra usa a cotação de **venda**; a venda, a valorização e o valor atual usam a de **compra**.
servers:
  - url: /
    description: Este servidor (o mesmo endereço desta página)
  - url: http://localhost:3333
    description: Local
  - url: https://bitcoinzz.onrender.com
    description: Produção (Render, plano gratuito; pode levar ~1 min para acordar)
tags:
  - name: Sistema
  - name: Conta
  - name: Bitcoin
  - name: Relatórios
security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [Sistema]
      summary: Informações da API e links úteis
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: { name: Bitcoinzz API, docs: /docs, health: /health }

  /health:
    get:
      tags: [Sistema]
      summary: Status da API e do banco
      security: []
      responses:
        '200':
          description: API e banco funcionando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Banco indisponível
          content:
            application/json:
              example: { status: degraded, database: down }

  /account:
    post:
      tags: [Conta]
      summary: Cadastro
      description: 'Senha: mínimo de 8 caracteres, com pelo menos uma letra e um número. Limite: 30 cadastros por hora por IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { statusCode: 409, message: Este e-mail já está cadastrado }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Conta]
      summary: Perfil do usuário logado
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /login:
    post:
      tags: [Conta]
      summary: Login (devolve um JWT válido por 8 h)
      description: Até 10 senhas erradas por e-mail a cada 15 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Token JWT
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: E-mail ou senha inválidos (mesma resposta para os dois casos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { statusCode: 401, message: E-mail ou senha inválidos }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /account/deposit:
    post:
      tags: [Conta]
      summary: Depósito em R$ (envia e-mail de confirmação)
      description: Máximo de R$ 1.000.000,00 por depósito.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountInput' }
            example: { amount: 87.5 }
      responses:
        '201':
          description: Depósito registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /account/balance:
    get:
      tags: [Conta]
      summary: Saldo disponível em R$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /btc/price:
    get:
      tags: [Bitcoin]
      summary: Cotação atual do BTC (cache de 10 s)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Price' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /btc:
    get:
      tags: [Bitcoin]
      summary: Posição dos investimentos
      description: Investimentos abertos com data de compra, valor investido, cotação na compra, variação % do preço e valor bruto atual.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /btc/purchase:
    post:
      tags: [Bitcoin]
      summary: Compra de BTC com o saldo (cotação de venda; envia e-mail)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountInput' }
            example: { amount: 25 }
      responses:
        '201':
          description: Compra realizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Saldo insuficiente ou valor que não compra 1 satoshi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { statusCode: 422, message: 'Saldo insuficiente. Disponível: R$ 10,00.' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /btc/sell:
    post:
      tags: [Bitcoin]
      summary: Venda de BTC informando o valor em R$ (FIFO; envia e-mail)
      description: |
        Consome os investimentos do mais antigo para o mais novo, pela cotação de compra atual.
        Se um investimento for atingido parcialmente, ele é encerrado e o BTC que sobra vira um
        **reinvestimento** com a cotação e a data originais. O extrato registra `SALE` e `REINVESTMENT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmountInput' }
            example: { amount: 30 }
      responses:
        '201':
          description: Venda realizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Valor maior que a posição, ou nenhum bitcoin para vender
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                statusCode: 422
                message: 'Valor maior que a sua posição. Máximo disponível para venda: R$ 799,99.'
        '503': { $ref: '#/components/responses/Unavailable' }

  /extract:
    get:
      tags: [Relatórios]
      summary: Extrato (padrão dos últimos 90 dias)
      description: Datas no horário de São Paulo, incluindo o dia inteiro das duas pontas. Período máximo de 366 dias.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-09-01' }
          description: Data inicial (AAAA-MM-DD). Sem ela, 90 dias antes de `to`.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-10-06' }
          description: Data final (AAAA-MM-DD). Sem ela, hoje.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /volume:
    get:
      tags: [Relatórios]
      summary: BTC comprado e vendido na plataforma hoje (todos os clientes)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Volume' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /history:
    get:
      tags: [Relatórios]
      summary: Cotação de 10 em 10 minutos nas últimas 24 h
      description: |
        Até 144 pontos, em ordem crescente. `TICKER`: cotação coletada pelo job.
        `BACKFILL`: lacuna preenchida com o preço negociado (compra = venda, aproximado).
        Dados com mais de 90 dias são apagados automaticamente.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryPoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Dados inválidos (um item em `details` por campo)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 400
            message: Dados inválidos
            details: [{ field: amount, message: O valor deve ser maior que zero }]
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { statusCode: 401, message: Token de acesso não informado }
    TooManyRequests:
      description: Muitas tentativas; aguarde alguns minutos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Cotação do Mercado Bitcoin indisponível
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 503
            message: Cotação do bitcoin indisponível no momento. Tente novamente em instantes.

  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer, example: 400 }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: amount }
              message: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [up, down] }

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, example: Fulano da Silva }
        email: { type: string, format: email, example: fulano@email.com }
        password: { type: string, minLength: 8, maxLength: 72, example: fulano123 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: fulano@email.com }
        password: { type: string, example: fulano123 }

    Account:
      type: object
      properties:
        id: { type: string, example: 6ac57bc0df307fcb62da2611 }
        name: { type: string, example: Fulano da Silva }
        email: { type: string, example: fulano@email.com }

    AmountInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          description: Valor em R$, maior que zero e com no máximo 2 casas decimais.
          example: 100

    Balance:
      type: object
      properties:
        balance: { type: number, description: Saldo em R$, example: 462.5 }

    Price:
      type: object
      properties:
        buy:
          {
            type: number,
            description: Cotação de compra do mercado (usada na venda do cliente),
            example: 427253,
          }
        sell:
          {
            type: number,
            description: Cotação de venda do mercado (usada na compra do cliente),
            example: 427254,
          }
        updatedAt: { type: string, format: date-time }

    PurchaseResult:
      type: object
      properties:
        amount: { type: number, description: R$ investidos, example: 25 }
        btcAmount: { type: number, description: BTC comprado, example: 0.00005851 }
        btcPrice: { type: number, description: Cotação usada, example: 427254 }
        balance: { type: number, description: Saldo após a compra, example: 75 }

    SaleResult:
      type: object
      properties:
        amount: { type: number, description: R$ resgatados, example: 300 }
        btcAmount: { type: number, description: BTC vendido, example: 0.00070217 }
        btcPrice: { type: number, description: Cotação usada, example: 427253 }
        reinvestment:
          nullable: true
          description: Sobra de BTC reinvestida (null se não houve venda parcial)
          allOf: [{ $ref: '#/components/schemas/Reinvestment' }]
        balance: { type: number, description: Saldo após a venda, example: 500 }

    Reinvestment:
      type: object
      properties:
        amount: { type: number, description: Valor pela cotação original, example: 499.99 }
        btcAmount: { type: number, example: 0.00117025 }
        btcPrice: { type: number, description: Cotação ORIGINAL do investimento, example: 427254 }

    Position:
      type: object
      properties:
        summary:
          type: object
          properties:
            invested: { type: number, example: 800 }
            btcAmount: { type: number, example: 0.00187242 }
            currentValue: { type: number, example: 799.99 }
            returnPercent: { type: number, description: Resultado % da carteira, example: 0 }
            currentBtcPrice: { type: number, nullable: true, example: 427253 }
        investments:
          type: array
          items: { $ref: '#/components/schemas/PositionItem' }

    PositionItem:
      type: object
      properties:
        id: { type: string }
        purchasedAt: { type: string, format: date-time, description: Data da compra (ordem FIFO) }
        investedAmount: { type: number, example: 800 }
        btcAmount: { type: number, example: 0.00187242 }
        btcPriceAtPurchase: { type: number, example: 427254 }
        priceVariationPercent:
          { type: number, description: Variação % do preço desde a compra, example: 1.25 }
        currentValue:
          { type: number, description: Valor bruto atual (vendendo agora), example: 799.99 }
        origin: { type: string, enum: [PURCHASE, REINVESTMENT] }

    Statement:
      type: object
      properties:
        from: { type: string, format: date, example: '2026-07-08' }
        to: { type: string, format: date, example: '2026-10-06' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/StatementEntry' }

    StatementEntry:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [DEPOSIT, PURCHASE, SALE, REINVESTMENT] }
        amount: { type: number, example: 300 }
        btcAmount:
          { type: number, nullable: true, description: null em depósitos, example: 0.00070217 }
        btcPrice:
          {
            type: number,
            nullable: true,
            description: Cotação usada (null em depósitos),
            example: 427253,
          }
        createdAt: { type: string, format: date-time }

    Volume:
      type: object
      properties:
        date: { type: string, format: date, example: '2026-10-06' }
        bought: { type: number, description: BTC comprado hoje, example: 0.00193093 }
        sold: { type: number, description: BTC vendido hoje, example: 0.00070217 }

    HistoryPoint:
      type: object
      properties:
        timestamp: { type: string, format: date-time, example: '2026-10-06T11:10:00.000Z' }
        buy: { type: number, example: 427253 }
        sell: { type: number, example: 427254 }
        source: { type: string, enum: [TICKER, BACKFILL] }
